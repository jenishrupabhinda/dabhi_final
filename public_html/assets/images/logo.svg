<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <!-- Dabhi Chikki Horizontal Header Wordmark -->
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#2b1311" flood-opacity="1"/>
    </filter>
    <linearGradient id="warmGrad" x1="0" y1="0" x2="0" y2="1">
      <feStop offset="0%" stop-color="#e2724c"/>
      <feStop offset="100%" stop-color="#c7613d"/>
    </linearGradient>
  </defs>

  <!-- Group with 3D drop shadow -->
  <g filter="url(#shadow)">
    <!-- Main "DABHI CHIKKI" retro lettering -->
    <text x="10" y="44" 
          font-family="'Recoleta Alt', 'Recoleta', 'Poppins', Georgia, serif" 
          font-weight="900" 
          font-size="44" 
          letter-spacing="-0.03em" 
          fill="#c7613d" 
          stroke="#2b1311" 
          stroke-width="3.5" 
          paint-order="stroke fill">Dabhi Chikki</text>
  </g>

  <!-- Subtitle: SINCE 2009 with subtle decorative dots -->
  <g transform="translate(14, 68)">
    <text x="0" y="0" 
          font-family="'Cascadia Code', ui-monospace, monospace" 
          font-weight="700" 
          font-size="11.5" 
          letter-spacing="0.26em" 
          fill="#541f21" 
          opacity="0.95">HANDCRAFTED · SINCE 2009</text>
  </g>
</svg>
